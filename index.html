<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Výrobní plán pivovaru Bizon-->NOZIB</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 p-4"><div class="max-w-7xl mx-auto">
<h1 class="text-4xl font-bold text-center mb-4">
🍺 Výrobní plán pivovaru Bizon-->NOZIBe
</h1>
<div class="bg-white rounded-xl shadow p-3 mb-4 flex justify-center gap-4">
<button onclick="changeWeek(-1)" class="px-4 py-2 bg-slate-200 rounded">
← Předchozí týden
</button><div id="weekLabel" class="font-bold flex items-center"></div><button onclick="changeWeek(1)"class="px-4 py-2 bg-slate-200 rounded">
Další týden →
</button>
</div>
<div class="flex gap-3 mb-4">
<select id="personFilter" class="border p-2 rounded" onchange="render()">
<option value="">👤 Všichni</option><option>Michael</option><option>Robert</option><option>Matej</option><option>Rene</option><option>David</option></select></div><div id="stats" class="grid grid-cols-4 gap-2 mb-4"></div><table class="w-full bg-white shadow rounded-xl overflow-hidden"><thead><tr class="bg-slate-800 text-white"><th class="p-3 text-left">Datum</th><th>🍺 Vaření</th><th>🍾 Stáčení</th><th>🧼 Sanitace</th><th>📋 Provoz</th></tr></thead><tbody id="plannerBody"></tbody></table></div><div id="modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center"><div class="bg-white rounded-2xl p-5 w-96"><h2 id="modalTitle" class="font-bold text-xl mb-3">Úkol</h2><div id="tankWrap"><label>Tank</label><select id="tank" class="w-full border p-2 rounded mb-3"></select></div><label>Název úkolu</label><input id="taskName" class="w-full border p-2 rounded mb-3"><label>Osoba</label><select id="person" class="w-full border p-2 rounded mb-3"><option>Michael</option><option>Robert</option><option>Matej</option><option>Rene</option><option>David</option></select><label>Status</label><select id="status" class="w-full border p-2 rounded mb-3"><option>Plánováno</option><option>Probíhá</option><option>Hotovo</option><option>Pozastaveno</option></select><div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-3 py-2 bg-slate-200 rounded">Zrušit</button><button onclick="saveTask()" class="px-3 py-2 bg-blue-600 text-white rounded">Uložit</button></div></div></div><script>for(let i=1;i<=21;i++)tank.innerHTML+=`<option>Tank ${i}</option>`;const cats={vareni:'🍺',staceni:'🍾',sanitace:'🧼',provoz:'📋'};
function getColor(cat){if(cat==='vareni') return 'bg-blue-500';if(cat==='staceni') return 'bg-green-500';if(cat==='sanitace') return 'bg-orange-500';return 'bg-slate-500';}
let weekOffset=0,
tasks=JSON.parse(localStorage.getItem('breweryPlannerV5')||'{}'),
currentDate='',
currentCat='',
editId=null;
 
function changeWeek(step){
weekOffset += step;
render();
}
 
function wk(d){
d=new Date(d);
d.setHours(0,0,0);
d.setDate(d.getDate()+3-(d.getDay()+6)%7);
 
let w1=new Date(d.getFullYear(),0,4);
 
return 1 + Math.round(
((d-w1)/86400000 - 3 + (w1.getDay()+6)%7)/7
);
}
 
function getDays(){function getDays(){const n=new Date(),m=new Date(n),d=m.getDay(),diff=d===0?-6:1-d;m.setDate(m.getDate()+diff+weekOffset*7);let a=[];for(let i=0;i<5;i++){let x=new Date(m);x.setDate(m.getDate()+i);a.push(x)}return a}function openModal(date,cat){currentDate=date;currentCat=cat;editId=null;modalTitle.textContent='Nový úkol';taskName.value='';status.value='Plánováno';tankWrap.style.display=cat==='provoz'?'none':'block';modal.classList.remove('hidden')}function editTask(date,cat,id){let t=(tasks[date+'-'+cat]||[]).find(x=>x.id===id);if(!t)return;currentDate=date;currentCat=cat;editId=id;taskName.value=t.title;person.value=t.person;status.value=t.status||'Plánováno';tank.value=t.tank||'Tank 1';tankWrap.style.display=cat==='provoz'?'none':'block';modal.classList.remove('hidden')}function closeModal(){modal.classList.add('hidden')}function saveTask(){let k=currentDate+'-'+currentCat;if(!tasks[k])tasks[k]=[];if(editId){let t=tasks[k].find(x=>x.id===editId);t.title=taskName.value;t.person=person.value;t.status=document.getElementById('status').value;t.tank=currentCat==='provoz'?'':tank.value}else{tasks[k].push({id:Date.now(),title:taskName.value,person:person.value,status:document.getElementById('status').value,tank:currentCat==='provoz'?'':tank.value})}console.log(status.value);localStorage.setItem('breweryPlannerV5',JSON.stringify(tasks));closeModal();render()}function delTask(d,c,id){tasks[d+'-'+c]=(tasks[d+'-'+c]||[]).filter(x=>x.id!==id);localStorage.setItem('breweryPlannerV5',JSON.stringify(tasks));render()}function badge(s){return s==='Hotovo'?'🟢':s==='Probíhá'?'🟡':s==='Pozastaveno'?'🔴':'⚪'}function render(){let first=getDays()[0];weekLabel.textContent='Týden '+wk(first);let p=0,r=0,h=0,z=0;Object.values(tasks).flat().forEach(t=>{let s=t.status||'Plánováno';if(s==='Hotovo')h++;else if(s==='Probíhá')r++;else if(s==='Pozastaveno')z++;else p++});stats.innerHTML=`<div class="bg-white p-2 rounded">⚪ ${p}</div><div class="bg-white p-2 rounded">🟡 ${r}</div><div class="bg-white p-2 rounded">🟢 ${h}</div><div class="bg-white p-2 rounded">🔴 ${z}</div>`;plannerBody.innerHTML='';let filter=personFilter.value;getDays().forEach(day=>{let date=day.toISOString().split('T')[0];let tr=document.createElement('tr');tr.className = (plannerBody.children.length % 2 === 0)? 'bg-amber-50': 'bg-white';let rowColor = (plannerBody.children.length % 2 === 0)? 'bg-amber-50': 'bg-white';tr.innerHTML=`<td class="p-3 ${rowColor}
font-semibold">${day.toLocaleDateString('cs-CZ',{weekday:'long'})}<br>${day.toLocaleDateString('cs-CZ')}</td>`;Object.keys(cats).forEach(cat=>{let td=document.createElement('td');td.className='align-top p-2';let html='';(tasks[date+'-'+cat]||[]).filter(t=>!filter||t.person===filter).forEach(t=>{html+=`<div class="bg-white rounded-xl shadow mb-2 overflow-hidden"><div class="${getColor(cat)} text-white p-2"><b>${cats[cat]} ${t.title}</b>${cat!=='provoz'?`<div>🛢 ${t.tank}</div>`:''}<div>👤 ${t.person}</div><div>${badge(t.status)} ${t.status||'Plánováno'}</div></div><div class="p-2 text-right"><button onclick="editTask('${date}','${cat}',${t.id})">✏️</button> <button onclick="delTask('${date}','${cat}',${t.id})">❌</button></div></div>`});html+=`<button class="w-full border-2 border-dashed rounded p-2" onclick="openModal('${date}','${cat}')">+ Přidat úkol</button>`;td.innerHTML=html;tr.appendChild(td)});plannerBody.appendChild(tr)})}render();</script></body></html>
