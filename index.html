<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brewery Planner v5.1</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 p-4"><div class="max-w-7xl mx-auto"><h1 class="text-4xl font-bold text-center mb-4">🍺 Výrobní plán pivovaru v5.1</h1><div class="flex gap-3 mb-4"><select id="personFilter" class="border p-2 rounded"><option value="">👤 Všichni</option><option>Michael</option><option>Robert</option><option>Matej</option><option>Rene</option><option>David</option></select><div id="weekLabel" class="ml-auto font-bold"></div></div><div id="stats" class="grid grid-cols-4 gap-2 mb-4"></div><table class="w-full bg-white rounded-xl shadow overflow-hidden"><thead><tr class="bg-slate-800 text-white"><th class="p-3 text-left">Datum</th><th>🍺 Vaření</th><th>🍾 Stáčení</th><th>🧼 Sanitace</th><th>📋 Provoz</th></tr></thead><tbody id="plannerBody"></tbody></table></div><script>const STORAGE='breweryPlannerV51';const cats={vareni:{e:'🍺',c:'bg-blue-500'},staceni:{e:'🍾',c:'bg-green-500'},sanitace:{e:'🧼',c:'bg-orange-500'},provoz:{e:'📋',c:'bg-slate-500'}};let tasks=JSON.parse(localStorage.getItem(STORAGE)||'{}');let filter=document.getElementById('personFilter');filter.onchange=render;function statusLabel(v){return({planned:'Plánováno',progress:'Probíhá',done:'Hotovo',hold:'Pozastaveno'})[v]||'Plánováno'}function badge(v){return({planned:'⚪',progress:'🟡',done:'🟢',hold:'🔴'})[v]||'⚪'}function wk(d){d=new Date(d);d.setDate(d.getDate()+3-(d.getDay()+6)%7);let w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7)}function days(){let n=new Date(),m=new Date(n),g=m.getDay();m.setDate(m.getDate()+(g===0?-6:1-g));let a=[];for(let i=0;i<5;i++){let x=new Date(m);x.setDate(m.getDate()+i);a.push(x)}return a}function save(){localStorage.setItem(STORAGE,JSON.stringify(tasks))}function add(date,cat){let title=prompt('Název úkolu');if(!title)return;let person=prompt('Michael/Robert/Matej/Rene/David','Michael')||'Michael';let tank=cat==='provoz'?'':prompt('CKT-1 až CKT-21','CKT-1');let st=prompt('planned/progress/done/hold','planned')||'planned';let k=date+'-'+cat;(tasks[k]=tasks[k]||[]).push({id:Date.now(),title,person,tank,status:st});save();render()}function editTask(date,cat,id){let t=(tasks[date+'-'+cat]||[]).find(x=>x.id===id);if(!t)return;t.title=prompt('Název',t.title)||t.title;t.person=prompt('Osoba',t.person)||t.person;if(cat!=='provoz')t.tank=prompt('Tank',t.tank)||t.tank;t.status=prompt('planned/progress/done/hold',t.status)||t.status;save();render()}function delTask(date,cat,id){tasks[date+'-'+cat]=(tasks[date+'-'+cat]||[]).filter(x=>x.id!==id);save();render()}function render(){let p=0,r=0,d=0,h=0;Object.values(tasks).flat().forEach(t=>{if(t.status==='done')d++;else if(t.status==='progress')r++;else if(t.status==='hold')h++;else p++});stats.innerHTML=`<div class="bg-white p-2 rounded">⚪ ${p}</div><div class="bg-white p-2 rounded">🟡 ${r}</div><div class="bg-white p-2 rounded">🟢 ${d}</div><div class="bg-white p-2 rounded">🔴 ${h}</div>`;weekLabel.textContent='Týden '+wk(days()[0]);plannerBody.innerHTML='';days().forEach(day=>{let date=day.toISOString().split('T')[0];let tr=document.createElement('tr');tr.innerHTML=`<td class="p-3 bg-slate-50 font-semibold">${day.toLocaleDateString('cs-CZ',{weekday:'long'})}<br>${day.toLocaleDateString('cs-CZ')}</td>`;for(let cat in cats){let td=document.createElement('td');td.className='p-2 align-top';let html='';(tasks[date+'-'+cat]||[]).filter(t=>!filter.value||t.person===filter.value).forEach(t=>{html+=`<div class="rounded-xl overflow-hidden shadow mb-2"><div class="${cats[cat].c} text-white p-2"><b>${cats[cat].e} ${t.title}</b>${cat!=='provoz'?'<div>🛢 '+t.tank+'</div>':''}<div>👤 ${t.person}</div><div>${badge(t.status)} ${statusLabel(t.status)}</div></div><div class="p-2 text-right"><button onclick="editTask('${date}','${cat}',${t.id})">✏️</button> <button onclick="delTask('${date}','${cat}',${t.id})">❌</button></div></div>`});html+=`<button class="w-full border-2 border-dashed rounded p-2" onclick="add('${date}','${cat}')">+ Přidat úkol</button>`;td.innerHTML=html;tr.appendChild(td)}plannerBody.appendChild(tr)})}render();</script></body></html>
